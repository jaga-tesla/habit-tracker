<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<style>
:root{--bg:#f5f4fb;--card:#fff;--primary:#7557d9;--primary-light:#eee9ff;--green:#41c99a;--text:#242331;--muted:#848191;--border:#eceaf3}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.app{width:100%;max-width:1050px;margin:auto;padding:16px}.header{background:linear-gradient(135deg,#7557d9,#a489f1);color:#fff;padding:22px;border-radius:22px;margin-bottom:16px}.header h1{margin:0;font-size:26px}.header p{margin:6px 0 0;opacity:.85}.user-select{margin-top:20px}.user-select label{display:block;font-size:13px;margin-bottom:7px;opacity:.9}select{width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;outline:none}
.date-box{display:flex;justify-content:space-between;align-items:center;margin:18px 0;gap:10px}.date-box input{border:1px solid var(--border);border-radius:10px;padding:10px;background:#fff}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 5px 18px rgba(0,0,0,.04)}.stat{text-align:center}.circle{width:84px;height:84px;margin:auto;border-radius:50%;background:conic-gradient(var(--green) calc(var(--percent)*1%),#ececec 0);display:flex;align-items:center;justify-content:center;position:relative}.circle:before{content:"";width:65px;height:65px;background:#fff;border-radius:50%;position:absolute}.circle span{position:relative;font-size:16px;font-weight:bold}.stat h4{margin:12px 0 0;color:var(--muted);font-size:12px}.main-grid{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.section-title h2{font-size:18px;margin:0}.btn{border:none;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:bold}.btn-primary{background:var(--primary);color:#fff}.btn-light{background:var(--primary-light);color:var(--primary)}.habit{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}.habit.completed{background:#ecfff8;border-color:#b9efdc}.habit-info{display:flex;align-items:center;gap:12px}.habit input[type=checkbox]{width:23px;height:23px;accent-color:var(--green)}.habit-name{font-weight:600;font-size:14px}.habit.completed .habit-name{text-decoration:line-through;color:#777}.habit-actions{display:flex;gap:5px}.icon-btn{border:none;background:#f2f1f6;border-radius:7px;padding:7px 9px;cursor:pointer}.progress-row{margin-bottom:15px}.progress-header{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.progress-track{height:10px;background:#ececf2;border-radius:20px;overflow:hidden}.progress-fill{height:100%;background:var(--green);border-radius:20px}.graph-card{margin-top:16px}.graph{height:240px;display:flex;align-items:flex-end;gap:8px;overflow-x:auto;padding:30px 5px 5px}.graph-item{min-width:42px;text-align:center}.graph-bar-area{height:170px;display:flex;justify-content:center;align-items:flex-end}.graph-bar{width:26px;min-height:3px;background:linear-gradient(180deg,var(--primary),#b09af2);border-radius:8px 8px 3px 3px;position:relative}.graph-value{position:absolute;top:-21px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:bold;white-space:nowrap}.graph-date{font-size:10px;color:var(--muted);margin-top:7px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.show{display:flex}.modal-content{width:100%;max-width:430px;background:#fff;border-radius:18px;padding:20px}.modal-content h3{margin-top:0}.modal-content input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:10px 0 15px;font-size:15px}.modal-actions{display:flex;gap:10px}.modal-actions button{flex:1}.empty{text-align:center;padding:30px 10px;color:var(--muted)}
@media(max-width:750px){.app{padding:10px}.header{border-radius:0 0 24px 24px;margin:-10px -10px 15px;padding:22px 16px}.header h1{font-size:23px}.summary-grid{grid-template-columns:repeat(2,1fr)}.main-grid{grid-template-columns:1fr}.circle{width:72px;height:72px}.circle:before{width:56px;height:56px}.date-box{align-items:flex-start;flex-direction:column}.date-box input{width:100%}.habit{padding:12px}.habit-name{font-size:13px}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Habit Tracker 🚀</h1><p>Build your future every day.</p>
    <div class="user-select"><label>Select User</label><select id="userSelect" onchange="changeUser()"><option value="jack">Jack</option><option value="manthra">Manthra</option></select></div>
  </div>
  <div class="date-box"><div><strong id="welcomeText">Jack's Daily Tracker</strong><div id="dateDisplay" style="color:#888;font-size:13px;margin-top:4px"></div></div><input type="date" id="selectedDate" onchange="changeDate()"></div>
  <div class="summary-grid">
    <div class="card stat"><div class="circle" id="todayCircle" style="--percent:0"><span id="todayPercent">0%</span></div><h4>DAILY PROGRESS</h4></div>
    <div class="card stat"><div class="circle" id="weekCircle" style="--percent:0"><span id="weekPercent">0%</span></div><h4>WEEKLY PROGRESS</h4></div>
    <div class="card stat"><div class="circle" id="monthCircle" style="--percent:0"><span id="monthPercent">0%</span></div><h4>MONTHLY PROGRESS</h4></div>
    <div class="card stat"><div class="circle" id="momentumCircle" style="--percent:0"><span id="momentumValue">0/0</span></div><h4>TODAY COMPLETED</h4></div>
  </div>
  <div class="main-grid">
    <div class="card"><div class="section-title"><h2>Today's Goals</h2><button class="btn btn-primary" onclick="openAddModal()">+ Add Goal</button></div><div id="habitList"></div></div>
    <div class="card"><div class="section-title"><h2>Goal Progress</h2></div><div id="goalProgress"></div><hr style="border:none;border-top:1px solid #eee;margin:20px 0"><div><div class="progress-header"><span>Completed</span><strong id="completedCount">0</strong></div><div class="progress-header"><span>Remaining</span><strong id="remainingCount">0</strong></div><div class="progress-header"><span>Current Streak</span><strong id="streakCount">0 days</strong></div></div></div>
  </div>
  <div class="card graph-card"><div class="section-title"><h2>📊 Last 14 Days</h2><span style="color:#888;font-size:12px">Completed / Total Goals</span></div><div class="graph" id="graph"></div></div>
</div>
<div class="modal" id="goalModal"><div class="modal-content"><h3 id="modalTitle">Add New Goal</h3><input type="text" id="goalInput" placeholder="Enter your goal..."><div class="modal-actions"><button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveGoal()">Save</button></div></div></div>
<script>
const defaultGoals=["Communication Development","Body Transformation","Mental Transformation","Knowledge Enhancement","Wisdom","Modeling","Future Business"];
let appData=JSON.parse(localStorage.getItem("ultimateHabitTracker"))||{};
function createUser(user){if(!appData[user]){appData[user]={goals:defaultGoals.map((name,index)=>({id:String(Date.now()+index+Math.random()),name})),days:{}}}}
createUser("jack");createUser("manthra");saveData();
let currentUser="jack",selectedDate=getToday(),editingGoalId=null;
function getToday(){return formatDate(new Date())}
function formatDate(date){return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0")}
function parseDate(s){const p=s.split("-");return new Date(p[0],p[1]-1,p[2])}
function saveData(){localStorage.setItem("ultimateHabitTracker",JSON.stringify(appData))}
function changeUser(){currentUser=document.getElementById("userSelect").value;renderEverything()}
function changeDate(){selectedDate=document.getElementById("selectedDate").value;renderEverything()}
function getDayData(date){const u=appData[currentUser];if(!u.days[date])u.days[date]={};return u.days[date]}
function toggleGoal(id,checked){getDayData(selectedDate)[id]=checked;saveData();renderEverything()}
function renderHabits(){const c=document.getElementById("habitList"),goals=appData[currentUser].goals,day=getDayData(selectedDate);c.innerHTML="";if(!goals.length){c.innerHTML='<div class="empty">No goals added yet.</div>';return}goals.forEach(goal=>{const checked=day[goal.id]===true;const el=document.createElement("div");el.className="habit"+(checked?" completed":"");el.innerHTML=`<div class="habit-info"><input type="checkbox" ${checked?"checked":""} onchange="toggleGoal('${goal.id}',this.checked)"><span class="habit-name">${escapeHtml(goal.name)}</span></div><div class="habit-actions"><button class="icon-btn" onclick="editGoal('${goal.id}')">✏️</button><button class="icon-btn" onclick="deleteGoal('${goal.id}')">🗑️</button></div>`;c.appendChild(el)})}
function calculateDay(date){const goals=appData[currentUser].goals,day=appData[currentUser].days[date]||{};let completed=0;goals.forEach(g=>{if(day[g.id]===true)completed++});const total=goals.length;return{total,completed,percentage:total?Math.round(completed/total*100):0}}
function setCircle(cid,tid,p){document.getElementById(cid).style.setProperty("--percent",p);document.getElementById(tid).innerText=p+"%"}
function calculatePeriod(days){let possible=0,completed=0;const base=parseDate(selectedDate);for(let i=0;i<days;i++){const d=new Date(base);d.setDate(base.getDate()-i);const r=calculateDay(formatDate(d));possible+=r.total;completed+=r.completed}return possible?Math.round(completed/possible*100):0}
function calculateMonth(){const base=parseDate(selectedDate),y=base.getFullYear(),m=base.getMonth(),n=new Date(y,m+1,0).getDate();let possible=0,completed=0;for(let day=1;day<=n;day++){const r=calculateDay(formatDate(new Date(y,m,day)));possible+=r.total;completed+=r.completed}return possible?Math.round(completed/possible*100):0}
function calculateStreak(){let s=0;const base=parseDate(selectedDate);for(let i=0;i<365;i++){const d=new Date(base);d.setDate(base.getDate()-i);const r=calculateDay(formatDate(d));if(r.total>0&&r.completed===r.total)s++;else break}return s}
function renderDashboard(){const r=calculateDay(selectedDate);setCircle("todayCircle","todayPercent",r.percentage);document.getElementById("momentumCircle").style.setProperty("--percent",r.percentage);document.getElementById("momentumValue").innerText=r.completed+"/"+r.total;document.getElementById("completedCount").innerText=r.completed;document.getElementById("remainingCount").innerText=Math.max(r.total-r.completed,0);setCircle("weekCircle","weekPercent",calculatePeriod(7));setCircle("monthCircle","monthPercent",calculateMonth());document.getElementById("streakCount").innerText=calculateStreak()+" days"}
function renderGoalProgress(){const c=document.getElementById("goalProgress"),goals=appData[currentUser].goals;c.innerHTML="";if(!goals.length){c.innerHTML='<div class="empty">Add goals to view progress.</div>';return}const base=parseDate(selectedDate);goals.forEach(goal=>{let done=0;for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()-i);const day=appData[currentUser].days[formatDate(d)]||{};if(day[goal.id]===true)done++}const p=Math.round(done/7*100),row=document.createElement("div");row.className="progress-row";row.innerHTML=`<div class="progress-header"><span>${escapeHtml(goal.name)}</span><span>${done}/7</span></div><div class="progress-track"><div class="progress-fill" style="width:${p}%"></div></div>`;c.appendChild(row)})}
function renderGraph(){const g=document.getElementById("graph"),base=parseDate(selectedDate);g.innerHTML="";for(let i=13;i>=0;i--){const d=new Date(base);d.setDate(base.getDate()-i);const r=calculateDay(formatDate(d)),item=document.createElement("div");item.className="graph-item";item.innerHTML=`<div class="graph-bar-area"><div class="graph-bar" style="height:${r.percentage*1.5}px"><span class="graph-value">${r.completed}/${r.total}</span></div></div><div class="graph-date">${d.getDate()}/${d.getMonth()+1}</div>`;g.appendChild(item)}}
function openAddModal(){editingGoalId=null;document.getElementById("modalTitle").innerText="Add New Goal";document.getElementById("goalInput").value="";document.getElementById("goalModal").classList.add("show")}
function editGoal(id){const goal=appData[currentUser].goals.find(g=>String(g.id)===String(id));if(!goal)return;editingGoalId=goal.id;document.getElementById("modalTitle").innerText="Edit Goal";document.getElementById("goalInput").value=goal.name;document.getElementById("goalModal").classList.add("show")}
function saveGoal(){const input=document.getElementById("goalInput"),name=input.value.trim();if(!name){alert("Please enter a goal.");return}if(editingGoalId){const goal=appData[currentUser].goals.find(g=>String(g.id)===String(editingGoalId));if(goal)goal.name=name}else appData[currentUser].goals.push({id:String(Date.now()+Math.random()),name});saveData();closeModal();renderEverything()}
function deleteGoal(id){if(!confirm("Delete this goal?"))return;appData[currentUser].goals=appData[currentUser].goals.filter(g=>String(g.id)!==String(id));saveData();renderEverything()}
function closeModal(){document.getElementById("goalModal").classList.remove("show")}
function escapeHtml(text){const d=document.createElement("div");d.innerText=text;return d.innerHTML}
function renderEverything(){document.getElementById("selectedDate").value=selectedDate;document.getElementById("dateDisplay").innerText=parseDate(selectedDate).toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});const n=currentUser.charAt(0).toUpperCase()+currentUser.slice(1);document.getElementById("welcomeText").innerText=n+"'s Daily Tracker";renderHabits();renderDashboard();renderGoalProgress();renderGraph()}
document.getElementById("userSelect").value=currentUser;renderEverything();
</script>
</body>
</html>
