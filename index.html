<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<style>
:root{--bg:#f5f4fb;--card:#fff;--primary:#7557d9;--primary2:#9b82eb;--green:#41c99a;--text:#242331;--muted:#848191;--border:#eceaf3}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:1050px;margin:auto;padding:16px}.header{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;padding:22px;border-radius:22px;margin-bottom:16px}.header-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.header h1{margin:0;font-size:26px}.header p{margin:6px 0 0;opacity:.85}#syncStatus{background:rgba(255,255,255,.18);padding:8px 12px;border-radius:20px;font-size:12px}.user-select{margin-top:20px}.user-select label{display:block;font-size:13px;margin-bottom:7px;opacity:.9}select{width:100%;padding:13px;border:none;border-radius:12px;font-size:16px}.date-box{display:flex;justify-content:space-between;align-items:center;margin:18px 0;gap:10px}.date-box input{border:1px solid var(--border);border-radius:10px;padding:10px;background:white}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 5px 18px rgba(0,0,0,.04)}.stat{text-align:center}.circle{width:84px;height:84px;margin:auto;border-radius:50%;background:conic-gradient(var(--green) calc(var(--percent)*1%),#ececec 0);display:flex;align-items:center;justify-content:center;position:relative}.circle:before{content:"";width:65px;height:65px;background:white;border-radius:50%;position:absolute}.circle span{position:relative;font-size:16px;font-weight:bold}.stat h4{margin:12px 0 0;color:var(--muted);font-size:12px}.main-grid{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.section-title h2{font-size:18px;margin:0}.btn{border:none;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:bold}.btn-primary{background:var(--primary);color:white}.btn-light{background:#eee9ff;color:var(--primary)}.habit{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}.habit.completed{background:#ecfff8;border-color:#b9efdc}.habit-info{display:flex;align-items:center;gap:12px}.habit input[type=checkbox]{width:23px;height:23px;accent-color:var(--green)}.habit-name{font-weight:600;font-size:14px}.habit.completed .habit-name{text-decoration:line-through;color:#777}.habit-actions{display:flex;gap:5px}.icon-btn{border:none;background:#f2f1f6;border-radius:7px;padding:7px 9px;cursor:pointer}.progress-row{margin-bottom:15px}.progress-header{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}.progress-track{height:10px;background:#ececf2;border-radius:20px;overflow:hidden}.progress-fill{height:100%;background:var(--green);border-radius:20px}.graph-card{margin-top:16px}.graph{height:240px;display:flex;align-items:flex-end;gap:8px;overflow-x:auto;padding:30px 5px 5px}.graph-item{min-width:42px;text-align:center}.graph-bar-area{height:170px;display:flex;justify-content:center;align-items:flex-end}.graph-bar{width:26px;min-height:3px;background:linear-gradient(180deg,var(--primary),#b09af2);border-radius:8px 8px 3px 3px;position:relative}.graph-value{position:absolute;top:-21px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:bold;white-space:nowrap}.graph-date{font-size:10px;color:var(--muted);margin-top:7px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.show{display:flex}.modal-content{width:100%;max-width:430px;background:white;border-radius:18px;padding:20px}.modal-content input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:10px 0 15px;font-size:15px}.modal-actions{display:flex;gap:10px}.modal-actions button{flex:1}.empty{text-align:center;padding:30px 10px;color:var(--muted)}@media(max-width:750px){.app{padding:10px}.header{border-radius:0 0 24px 24px;margin:-10px -10px 15px;padding:22px 16px}.header h1{font-size:23px}.summary-grid{grid-template-columns:repeat(2,1fr)}.main-grid{grid-template-columns:1fr}.circle{width:72px;height:72px}.circle:before{width:56px;height:56px}.date-box{align-items:flex-start;flex-direction:column}.date-box input{width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div><h1>Habit Tracker 🚀</h1><p>Build your future every day.</p></div>
      <div id="syncStatus">Connecting...</div>
    </div>
    <div class="user-select"><label>Select User</label><select id="userSelect" onchange="changeUser()"><option value="jack">Jack</option><option value="manthra">Manthra</option></select></div>
  </div>
  <div class="date-box"><div><strong id="welcomeText">Jack's Daily Tracker</strong><div id="dateDisplay" style="color:#888;font-size:13px;margin-top:4px"></div></div><input type="date" id="selectedDate" onchange="changeDate()"></div>
  <div class="summary-grid">
    <div class="card stat"><div class="circle" id="todayCircle" style="--percent:0"><span id="todayPercent">0%</span></div><h4>DAILY PROGRESS</h4></div>
    <div class="card stat"><div class="circle" id="weekCircle" style="--percent:0"><span id="weekPercent">0%</span></div><h4>WEEKLY PROGRESS</h4></div>
    <div class="card stat"><div class="circle" id="monthCircle" style="--percent:0"><span id="monthPercent">0%</span></div><h4>MONTHLY PROGRESS</h4></div>
    <div class="card stat"><div class="circle" id="momentumCircle" style="--percent:0"><span id="momentumValue">0/0</span></div><h4>TODAY COMPLETED</h4></div>
  </div>
  <div class="main-grid">
    <div class="card"><div class="section-title"><h2>Today's Goals</h2><button class="btn btn-primary" onclick="openAddModal()">+ Add Goal</button></div><div id="habitList"></div></div>
    <div class="card"><div class="section-title"><h2>Goal Progress</h2></div><div id="goalProgress"></div><hr style="border:none;border-top:1px solid #eee;margin:20px 0"><div class="progress-header"><span>Completed</span><strong id="completedCount">0</strong></div><div class="progress-header"><span>Remaining</span><strong id="remainingCount">0</strong></div><div class="progress-header"><span>Current Streak</span><strong id="streakCount">0 days</strong></div></div>
  </div>
  <div class="card graph-card"><div class="section-title"><h2>📊 Last 14 Days</h2><span style="color:#888;font-size:12px">Completed / Total Goals</span></div><div class="graph" id="graph"></div></div>
</div>
<div class="modal" id="goalModal"><div class="modal-content"><h3 id="modalTitle">Add New Goal</h3><input type="text" id="goalInput" placeholder="Enter your goal..."><div class="modal-actions"><button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveGoal()">Save</button></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCnfrtitclKQkm7nLVRfvaOuY7vHuPRKRo",authDomain:"habit-tracker-709fa.firebaseapp.com",projectId:"habit-tracker-709fa",storageBucket:"habit-tracker-709fa.firebasestorage.app",messagingSenderId:"750101658622",appId:"1:750101658622:web:3ac7d4178312d37f769eaf",measurementId:"G-KZRNHZH12K"};
const firebaseApp=initializeApp(firebaseConfig);const db=getFirestore(firebaseApp);const trackerRef=doc(db,"habitTracker","main");
const defaultGoals=["Communication Development","Body Transformation","Mental Transformation","Knowledge Enhancement","Wisdom","Modeling","Future Business"];
let appData={},currentUser="jack",selectedDate=getToday(),editingGoalId=null;
function getToday(){return formatDate(new Date())}function formatDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function parseDate(s){const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}function generateId(){return Date.now().toString()+"-"+Math.random().toString(36).slice(2,8)}function createUser(u){if(!appData[u])appData[u]={goals:defaultGoals.map(name=>({id:generateId(),name})),days:{}}}function showSyncStatus(t){document.getElementById("syncStatus").innerText=t}
async function saveData(){try{showSyncStatus("Saving...");await setDoc(trackerRef,appData);showSyncStatus("Synced ✓")}catch(e){console.error(e);showSyncStatus("Sync failed");alert("Unable to save data. Check Firestore rules.")}}
async function loadInitialData(){try{showSyncStatus("Connecting...");const s=await getDoc(trackerRef);if(s.exists())appData=s.data();else{appData={};createUser("jack");createUser("manthra");await saveData()}createUser("jack");createUser("manthra");renderEverything();showSyncStatus("Synced ✓")}catch(e){console.error(e);showSyncStatus("Connection failed");alert("Firebase connection failed. Check Firestore rules.")}}
onSnapshot(trackerRef,s=>{if(s.exists()){appData=s.data();createUser("jack");createUser("manthra");renderEverything();showSyncStatus("Synced ✓")}},e=>{console.error(e);showSyncStatus("Sync failed")});
window.changeUser=function(){currentUser=document.getElementById("userSelect").value;renderEverything()};window.changeDate=function(){selectedDate=document.getElementById("selectedDate").value;renderEverything()};function getDayData(date){const u=appData[currentUser];if(!u.days)u.days={};if(!u.days[date])u.days[date]={};return u.days[date]};window.toggleGoal=async function(id,checked){getDayData(selectedDate)[id]=checked;renderEverything();await saveData()};
function calculateDay(date){const u=appData[currentUser];if(!u)return{total:0,completed:0,percentage:0};const goals=u.goals||[],day=u.days?.[date]||{};let completed=0;goals.forEach(g=>{if(day[g.id]===true)completed++});const total=goals.length;return{total,completed,percentage:total?Math.round(completed/total*100):0}}
function escapeHtml(t){const d=document.createElement("div");d.innerText=t;return d.innerHTML}
function renderHabits(){const c=document.getElementById("habitList"),u=appData[currentUser];if(!u)return;const goals=u.goals||[],day=getDayData(selectedDate);c.innerHTML="";if(!goals.length){c.innerHTML='<div class="empty">No goals added yet.</div>';return}goals.forEach(goal=>{const checked=day[goal.id]===true,el=document.createElement("div");el.className="habit"+(checked?" completed":"");el.innerHTML=`<div class="habit-info"><input type="checkbox" ${checked?"checked":""} onchange="toggleGoal('${goal.id}',this.checked)"><span class="habit-name">${escapeHtml(goal.name)}</span></div><div class="habit-actions"><button class="icon-btn" onclick="editGoal('${goal.id}')">✏️</button><button class="icon-btn" onclick="deleteGoal('${goal.id}')">🗑️</button></div>`;c.appendChild(el)})}
function setCircle(cid,tid,p){document.getElementById(cid).style.setProperty("--percent",p);document.getElementById(tid).innerText=p+"%"}function calculatePeriod(days){let total=0,done=0;const base=parseDate(selectedDate);for(let i=0;i<days;i++){const d=new Date(base);d.setDate(base.getDate()-i);const r=calculateDay(formatDate(d));total+=r.total;done+=r.completed}return total?Math.round(done/total*100):0}function calculateMonth(){const base=parseDate(selectedDate),y=base.getFullYear(),m=base.getMonth(),dim=new Date(y,m+1,0).getDate();let total=0,done=0;for(let day=1;day<=dim;day++){const r=calculateDay(formatDate(new Date(y,m,day)));total+=r.total;done+=r.completed}return total?Math.round(done/total*100):0}function calculateStreak(){let streak=0;const base=parseDate(selectedDate);for(let i=0;i<365;i++){const d=new Date(base);d.setDate(base.getDate()-i);const r=calculateDay(formatDate(d));if(r.total>0&&r.completed===r.total)streak++;else break}return streak}
function renderDashboard(){const t=calculateDay(selectedDate);setCircle("todayCircle","todayPercent",t.percentage);document.getElementById("momentumCircle").style.setProperty("--percent",t.percentage);document.getElementById("momentumValue").innerText=t.completed+"/"+t.total;document.getElementById("completedCount").innerText=t.completed;document.getElementById("remainingCount").innerText=Math.max(t.total-t.completed,0);setCircle("weekCircle","weekPercent",calculatePeriod(7));setCircle("monthCircle","monthPercent",calculateMonth());document.getElementById("streakCount").innerText=calculateStreak()+" days"}
function renderGoalProgress(){const c=document.getElementById("goalProgress");c.innerHTML="";const goals=appData[currentUser]?.goals||[],base=parseDate(selectedDate);if(!goals.length){c.innerHTML='<div class="empty">Add goals to view progress.</div>';return}goals.forEach(goal=>{let completedDays=0;for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()-i);const day=appData[currentUser].days?.[formatDate(d)]||{};if(day[goal.id]===true)completedDays++}const p=Math.round(completedDays/7*100),row=document.createElement("div");row.className="progress-row";row.innerHTML=`<div class="progress-header"><span>${escapeHtml(goal.name)}</span><span>${completedDays}/7</span></div><div class="progress-track"><div class="progress-fill" style="width:${p}%"></div></div>`;c.appendChild(row)})}
function renderGraph(){const g=document.getElementById("graph"),base=parseDate(selectedDate);g.innerHTML="";for(let i=13;i>=0;i--){const d=new Date(base);d.setDate(base.getDate()-i);const r=calculateDay(formatDate(d)),item=document.createElement("div");item.className="graph-item";item.innerHTML=`<div class="graph-bar-area"><div class="graph-bar" style="height:${r.percentage*1.5}px"><span class="graph-value">${r.completed}/${r.total}</span></div></div><div class="graph-date">${d.getDate()}/${d.getMonth()+1}</div>`;g.appendChild(item)}}
window.openAddModal=function(){editingGoalId=null;document.getElementById("modalTitle").innerText="Add New Goal";document.getElementById("goalInput").value="";document.getElementById("goalModal").classList.add("show")};window.editGoal=function(id){const goal=appData[currentUser].goals.find(g=>String(g.id)===String(id));if(!goal)return;editingGoalId=goal.id;document.getElementById("modalTitle").innerText="Edit Goal";document.getElementById("goalInput").value=goal.name;document.getElementById("goalModal").classList.add("show")};window.closeModal=function(){document.getElementById("goalModal").classList.remove("show")};window.saveGoal=async function(){const name=document.getElementById("goalInput").value.trim();if(!name){alert("Please enter a goal.");return}if(editingGoalId){const goal=appData[currentUser].goals.find(g=>String(g.id)===String(editingGoalId));if(goal)goal.name=name}else appData[currentUser].goals.push({id:generateId(),name});closeModal();renderEverything();await saveData()};window.deleteGoal=async function(id){if(!confirm("Delete this goal?"))return;appData[currentUser].goals=appData[currentUser].goals.filter(g=>String(g.id)!==String(id));renderEverything();await saveData()};
function renderEverything(){if(!appData[currentUser])return;document.getElementById("selectedDate").value=selectedDate;document.getElementById("userSelect").value=currentUser;document.getElementById("dateDisplay").innerText=parseDate(selectedDate).toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});const name=currentUser.charAt(0).toUpperCase()+currentUser.slice(1);document.getElementById("welcomeText").innerText=name+"'s Daily Tracker";renderHabits();renderDashboard();renderGoalProgress();renderGraph()}
document.getElementById("selectedDate").value=selectedDate;document.getElementById("userSelect").value=currentUser;loadInitialData();
</script>
</body>
</html>
