<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Habit Tracker</title>

<style>

:root{
    --bg:#f5f4fb;
    --card:#ffffff;
    --primary:#7557d9;
    --primary2:#9b82eb;
    --primary-light:#eee9ff;
    --green:#41c99a;
    --blue:#5ca9ff;
    --orange:#ffb657;
    --red:#ff7272;
    --text:#242331;
    --muted:#848191;
    --border:#eceaf3;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--text);
}

.app{
    width:100%;
    max-width:1050px;
    margin:auto;
    padding:16px;
}


/* =========================
   HEADER
========================= */

.header{
    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );
    color:white;
    padding:22px;
    border-radius:22px;
    margin-bottom:16px;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.header h1{
    margin:0;
    font-size:26px;
}

.header p{
    margin:6px 0 0;
    opacity:.85;
}

#syncStatus{
    background:rgba(255,255,255,.18);
    padding:8px 12px;
    border-radius:20px;
    font-size:12px;
    white-space:nowrap;
}

.user-select{
    margin-top:20px;
}

.user-select label{
    display:block;
    font-size:13px;
    margin-bottom:7px;
    opacity:.9;
}

select{
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    font-size:16px;
    outline:none;
}


/* =========================
   DATE
========================= */

.date-box{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:18px 0;
    gap:10px;
}

.date-box input{
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    background:white;
}


/* =========================
   SUMMARY
========================= */

.summary-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:16px;
}

.card{
    background:var(--card);
    border-radius:18px;
    padding:16px;
    box-shadow:0 5px 18px rgba(0,0,0,.04);
}

.stat{
    text-align:center;
}

.circle{
    width:84px;
    height:84px;
    margin:auto;
    border-radius:50%;

    background:
        conic-gradient(
            var(--green)
            calc(var(--percent) * 1%),
            #ececec 0
        );

    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.circle:before{
    content:"";
    width:65px;
    height:65px;
    background:white;
    border-radius:50%;
    position:absolute;
}

.circle span{
    position:relative;
    font-size:16px;
    font-weight:bold;
}

.stat h4{
    margin:12px 0 0;
    color:var(--muted);
    font-size:12px;
}


/* =========================
   MAIN
========================= */

.main-grid{
    display:grid;
    grid-template-columns:1.5fr .8fr;
    gap:16px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.section-title h2{
    font-size:18px;
    margin:0;
}

.btn{
    border:none;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-light{
    background:var(--primary-light);
    color:var(--primary);
}

.btn-danger{
    background:#ffe8e8;
    color:#d34a4a;
}


/* =========================
   HABITS
========================= */

.habit{
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    transition:.2s;
}

.habit.completed{
    background:#ecfff8;
    border-color:#b9efdc;
}

.habit-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.habit input[type=checkbox]{
    width:23px;
    height:23px;
    accent-color:var(--green);
}

.habit-name{
    font-weight:600;
    font-size:14px;
}

.habit.completed .habit-name{
    text-decoration:line-through;
    color:#777;
}

.habit-actions{
    display:flex;
    gap:5px;
}

.icon-btn{
    border:none;
    background:#f2f1f6;
    border-radius:7px;
    padding:7px 9px;
    cursor:pointer;
}


/* =========================
   PROGRESS
========================= */

.progress-row{
    margin-bottom:15px;
}

.progress-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    margin-bottom:6px;
}

.progress-track{
    height:10px;
    background:#ececf2;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    background:var(--green);
    border-radius:20px;
}


/* =========================
   GRAPH
========================= */

.graph-card{
    margin-top:16px;
}

.graph{
    height:240px;
    display:flex;
    align-items:flex-end;
    gap:8px;
    overflow-x:auto;
    padding:30px 5px 5px;
}

.graph-item{
    min-width:42px;
    text-align:center;
}

.graph-bar-area{
    height:170px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
}

.graph-bar{
    width:26px;
    min-height:3px;
    background:
        linear-gradient(
            180deg,
            var(--primary),
            #b09af2
        );
    border-radius:8px 8px 3px 3px;
    position:relative;
}

.graph-value{
    position:absolute;
    top:-21px;
    left:50%;
    transform:translateX(-50%);
    font-size:10px;
    font-weight:bold;
    white-space:nowrap;
}

.graph-date{
    font-size:10px;
    color:var(--muted);
    margin-top:7px;
}


/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:18px;
    padding:20px;
}

.modal-content h3{
    margin-top:0;
}

.modal-content input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    margin:10px 0 15px;
    font-size:15px;
}

.modal-actions{
    display:flex;
    gap:10px;
}

.modal-actions button{
    flex:1;
}

.empty{
    text-align:center;
    padding:30px 10px;
    color:var(--muted);
}


/* =========================
   MOBILE
========================= */

@media(max-width:750px){

    .app{
        padding:10px;
    }

    .header{
        border-radius:0 0 24px 24px;
        margin:-10px -10px 15px;
        padding:22px 16px;
    }

    .header h1{
        font-size:23px;
    }

    .header-top{
        align-items:flex-start;
    }

    .summary-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .main-grid{
        grid-template-columns:1fr;
    }

    .circle{
        width:72px;
        height:72px;
    }

    .circle:before{
        width:56px;
        height:56px;
    }

    .date-box{
        align-items:flex-start;
        flex-direction:column;
    }

    .date-box input{
        width:100%;
    }

    .habit{
        padding:12px;
    }

    .habit-name{
        font-size:13px;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="header-top">

            <div>
                <h1>Habit Tracker 🚀</h1>
                <p>Build your future every day.</p>
            </div>

            <div id="syncStatus">
                Connecting...
            </div>

        </div>


        <div class="user-select">

            <label>Select User</label>

            <select
                id="userSelect"
                onchange="changeUser()"
            >

                <option value="jack">
                    Jack
                </option>

                <option value="manthra">
                    Manthra
                </option>

            </select>

        </div>

    </div>


    <!-- DATE -->

    <div class="date-box">

        <div>

            <strong id="welcomeText">
                Jack's Daily Tracker
            </strong>

            <div
                id="dateDisplay"
                style="
                    color:#888;
                    font-size:13px;
                    margin-top:4px;
                "
            ></div>

        </div>


        <input
            type="date"
            id="selectedDate"
            onchange="changeDate()"
        >

    </div>


    <!-- SUMMARY -->

    <div class="summary-grid">


        <div class="card stat">

            <div
                class="circle"
                id="todayCircle"
                style="--percent:0"
            >

                <span id="todayPercent">
                    0%
                </span>

            </div>

            <h4>
                DAILY PROGRESS
            </h4>

        </div>


        <div class="card stat">

            <div
                class="circle"
                id="weekCircle"
                style="--percent:0"
            >

                <span id="weekPercent">
                    0%
                </span>

            </div>

            <h4>
                WEEKLY PROGRESS
            </h4>

        </div>


        <div class="card stat">

            <div
                class="circle"
                id="monthCircle"
                style="--percent:0"
            >

                <span id="monthPercent">
                    0%
                </span>

            </div>

            <h4>
                MONTHLY PROGRESS
            </h4>

        </div>


        <div class="card stat">

            <div
                class="circle"
                id="momentumCircle"
                style="--percent:0"
            >

                <span id="momentumValue">
                    0/0
                </span>

            </div>

            <h4>
                TODAY COMPLETED
            </h4>

        </div>

    </div>


    <!-- MAIN -->

    <div class="main-grid">


        <!-- HABITS -->

        <div class="card">

            <div class="section-title">

                <h2>
                    Today's Goals
                </h2>

                <button
                    class="btn btn-primary"
                    onclick="openAddModal()"
                >
                    + Add Goal
                </button>

            </div>


            <div id="habitList"></div>

        </div>


        <!-- PROGRESS -->

        <div class="card">

            <div class="section-title">

                <h2>
                    Goal Progress
                </h2>

            </div>


            <div id="goalProgress"></div>


            <hr
                style="
                    border:none;
                    border-top:1px solid #eee;
                    margin:20px 0;
                "
            >


            <div>

                <div class="progress-header">

                    <span>
                        Completed
                    </span>

                    <strong id="completedCount">
                        0
                    </strong>

                </div>


                <div class="progress-header">

                    <span>
                        Remaining
                    </span>

                    <strong id="remainingCount">
                        0
                    </strong>

                </div>


                <div class="progress-header">

                    <span>
                        Current Streak
                    </span>

                    <strong id="streakCount">
                        0 days
                    </strong>

                </div>

            </div>

        </div>

    </div>


    <!-- GRAPH -->

    <div class="card graph-card">

        <div class="section-title">

            <h2>
                📊 Last 14 Days
            </h2>

            <span
                style="
                    color:#888;
                    font-size:12px;
                "
            >
                Completed / Total Goals
            </span>

        </div>


        <div
            class="graph"
            id="graph"
        ></div>

    </div>

</div>



<!-- ADD / EDIT MODAL -->

<div
    class="modal"
    id="goalModal"
>

    <div class="modal-content">

        <h3 id="modalTitle">
            Add New Goal
        </h3>


        <input
            type="text"
            id="goalInput"
            placeholder="Enter your goal..."
        >


        <div class="modal-actions">

            <button
                class="btn btn-light"
                onclick="closeModal()"
            >
                Cancel
            </button>


            <button
                class="btn btn-primary"
                onclick="saveGoal()"
            >
                Save
            </button>

        </div>

    </div>

</div>



<script type="module">


/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

/*
IMPORTANT:

Firebase Console
→ Project Settings
→ Your Apps
→ Web App

Anga irukkura firebaseConfig-ai
inga replace pannu.
*/


const firebaseConfig = {

    apiKey:
        "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT_ID.firebaseapp.com",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT_ID.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const firebaseApp =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(
        firebaseApp
    );


/* =====================================================
   FIRESTORE DOCUMENT
===================================================== */

const trackerRef =
    doc(
        db,
        "habitTracker",
        "main"
    );


/* =====================================================
   DEFAULT GOALS
===================================================== */

const defaultGoals = [

    "Communication Development",

    "Body Transformation",

    "Mental Transformation",

    "Knowledge Enhancement",

    "Wisdom",

    "Modeling",

    "Future Business"

];


/* =====================================================
   VARIABLES
===================================================== */

let appData = {};

let currentUser =
    "jack";

let selectedDate =
    getToday();

let editingGoalId =
    null;


/* =====================================================
   DATE FUNCTIONS
===================================================== */

function getToday(){

    const d =
        new Date();

    return formatDate(d);

}


function formatDate(date){

    return (

        date.getFullYear()

        + "-"

        + String(
            date.getMonth()+1
        ).padStart(
            2,
            "0"
        )

        + "-"

        + String(
            date.getDate()
        ).padStart(
            2,
            "0"
        )

    );

}


function parseDate(
    dateString
){

    const parts =
        dateString.split("-");


    return new Date(

        Number(parts[0]),

        Number(parts[1])-1,

        Number(parts[2])

    );

}


/* =====================================================
   UNIQUE ID
===================================================== */

function generateId(){

    return (

        Date.now()
        .toString()

        + "-"

        + Math.random()
        .toString(36)
        .substring(2,8)

    );

}


/* =====================================================
   CREATE USER
===================================================== */

function createUser(user){

    if(
        !appData[user]
    ){

        appData[user] = {

            goals:
                defaultGoals.map(
                    name => ({

                        id:
                            generateId(),

                        name:
                            name

                    })
                ),

            days:{}

        };

    }

}


/* =====================================================
   INITIAL LOAD
===================================================== */

async function loadInitialData(){

    try{

        showSyncStatus(
            "Connecting..."
        );


        const snapshot =
            await getDoc(
                trackerRef
            );


        if(
            snapshot.exists()
        ){

            appData =
                snapshot.data();

        }

        else{

            appData = {};

            createUser(
                "jack"
            );

            createUser(
                "manthra"
            );


            await saveData();

        }


        createUser(
            "jack"
        );

        createUser(
            "manthra"
        );


        renderEverything();


        showSyncStatus(
            "Synced ✓"
        );

    }

    catch(error){

        console.error(
            error
        );


        showSyncStatus(
            "Connection failed"
        );


        alert(
            "Firebase connection failed. Check firebaseConfig and Firestore rules."
        );

    }

}


/* =====================================================
   REALTIME SYNC
===================================================== */

onSnapshot(

    trackerRef,

    snapshot => {

        if(
            snapshot.exists()
        ){

            appData =
                snapshot.data();


            createUser(
                "jack"
            );

            createUser(
                "manthra"
            );


            renderEverything();


            showSyncStatus(
                "Synced ✓"
            );

        }

    },

    error => {

        console.error(
            "Realtime Sync Error:",
            error
        );


        showSyncStatus(
            "Sync failed"
        );

    }

);


/* =====================================================
   SAVE DATA
===================================================== */

async function saveData(){

    try{

        showSyncStatus(
            "Saving..."
        );


        await setDoc(

            trackerRef,

            appData

        );


        showSyncStatus(
            "Synced ✓"
        );

    }

    catch(error){

        console.error(
            "Save Error:",
            error
        );


        showSyncStatus(
            "Sync failed"
        );


        alert(
            "Unable to save data to Firebase."
        );

    }

}


/* =====================================================
   SYNC STATUS
===================================================== */

function showSyncStatus(
    text
){

    const status =
        document.getElementById(
            "syncStatus"
        );


    if(status){

        status.innerText =
            text;

    }

}


/* =====================================================
   CHANGE USER
===================================================== */

window.changeUser =
function(){

    currentUser =
        document
        .getElementById(
            "userSelect"
        )
        .value;


    renderEverything();

};


/* =====================================================
   CHANGE DATE
===================================================== */

window.changeDate =
function(){

    selectedDate =
        document
        .getElementById(
            "selectedDate"
        )
        .value;


    renderEverything();

};


/* =====================================================
   GET DAY DATA
===================================================== */

function getDayData(
    date
){

    const user =
        appData[
            currentUser
        ];


    if(
        !user.days
    ){

        user.days = {};

    }


    if(
        !user.days[
            date
        ]
    ){

        user.days[
            date
        ] = {};

    }


    return user.days[
        date
    ];

}


/* =====================================================
   TOGGLE GOAL
===================================================== */

window.toggleGoal =
async function(
    goalId,
    checked
){

    const day =
        getDayData(
            selectedDate
        );


    day[
        goalId
    ] =
        checked;


    renderEverything();


    await saveData();

};


/* =====================================================
   CALCULATE DAY
===================================================== */

function calculateDay(
    date
){

    const user =
        appData[
            currentUser
        ];


    if(
        !user
    ){

        return{
            total:0,
            completed:0,
            percentage:0
        };

    }


    const goals =
        user.goals
        || [];


    const day =
        user.days?.[
            date
        ]
        || {};


    const total =
        goals.length;


    let completed =
        0;


    goals.forEach(
        goal => {

            if(
                day[
                    goal.id
                ]
                ===
                true
            ){

                completed++;

            }

        }
    );


    const percentage =
        total === 0

        ?

        0

        :

        Math.round(

            completed

            /

            total

            *

            100

        );


    return{

        total:
            total,

        completed:
            completed,

        percentage:
            percentage

    };

}


/* =====================================================
   RENDER HABITS
===================================================== */

function renderHabits(){

    const container =
        document.getElementById(
            "habitList"
        );


    const user =
        appData[
            currentUser
        ];


    if(
        !user
    ){

        return;

    }


    const goals =
        user.goals
        || [];


    const day =
        getDayData(
            selectedDate
        );


    container.innerHTML =
        "";


    if(
        goals.length
        ===
        0
    ){

        container.innerHTML =
            `
            <div class="empty">
                No goals added yet.
            </div>
            `;

        return;

    }


    goals.forEach(
        goal => {

            const checked =
                day[
                    goal.id
                ]
                ===
                true;


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "habit"
                +
                (
                    checked
                    ?
                    " completed"
                    :
                    ""
                );


            element.innerHTML = `

                <div class="habit-info">

                    <input
                        type="checkbox"

                        ${
                            checked
                            ?
                            "checked"
                            :
                            ""
                        }

                        onchange="
                            toggleGoal(
                                '${goal.id}',
                                this.checked
                            )
                        "
                    >

                    <span class="habit-name">

                        ${
                            escapeHtml(
                                goal.name
                            )
                        }

                    </span>

                </div>


                <div class="habit-actions">

                    <button
                        class="icon-btn"

                        onclick="
                            editGoal(
                                '${goal.id}'
                            )
                        "
                    >
                        ✏️
                    </button>


                    <button
                        class="icon-btn"

                        onclick="
                            deleteGoal(
                                '${goal.id}'
                            )
                        "
                    >
                        🗑️
                    </button>

                </div>

            `;


            container.appendChild(
                element
            );

        }
    );

}


/* =====================================================
   DASHBOARD
===================================================== */

function renderDashboard(){

    const today =
        calculateDay(
            selectedDate
        );


    setCircle(

        "todayCircle",

        "todayPercent",

        today.percentage

    );


    document
    .getElementById(
        "momentumCircle"
    )
    .style
    .setProperty(

        "--percent",

        today.percentage

    );


    document
    .getElementById(
        "momentumValue"
    )
    .innerText =

        today.completed

        +

        "/"

        +

        today.total;


    document
    .getElementById(
        "completedCount"
    )
    .innerText =

        today.completed;


    document
    .getElementById(
        "remainingCount"
    )
    .innerText =

        Math.max(

            today.total

            -

            today.completed,

            0

        );


    const week =
        calculatePeriod(
            7
        );


    setCircle(

        "weekCircle",

        "weekPercent",

        week

    );


    const month =
        calculateMonth();


    setCircle(

        "monthCircle",

        "monthPercent",

        month

    );


    document
    .getElementById(
        "streakCount"
    )
    .innerText =

        calculateStreak()

        +

        " days";

}


/* =====================================================
   CIRCLE
===================================================== */

function setCircle(
    circleId,
    textId,
    percentage
){

    document
    .getElementById(
        circleId
    )
    .style
    .setProperty(

        "--percent",

        percentage

    );


    document
    .getElementById(
        textId
    )
    .innerText =

        percentage

        +

        "%";

}


/* =====================================================
   WEEK
===================================================== */

function calculatePeriod(
    days
){

    let totalPossible =
        0;

    let completed =
        0;


    const base =
        parseDate(
            selectedDate
        );


    for(
        let i=0;
        i<days;
        i++
    ){

        const date =
            new Date(
                base
            );


        date.setDate(

            base.getDate()

            -

            i

        );


        const result =
            calculateDay(
                formatDate(
                    date
                )
            );


        totalPossible +=
            result.total;


        completed +=
            result.completed;

    }


    if(
        totalPossible
        ===
        0
    ){

        return 0;

    }


    return Math.round(

        completed

        /

        totalPossible

        *

        100

    );

}


/* =====================================================
   MONTH
===================================================== */

function calculateMonth(){

    const base =
        parseDate(
            selectedDate
        );


    const year =
        base.getFullYear();


    const month =
        base.getMonth();


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        )
        .getDate();


    let completed =
        0;

    let possible =
        0;


    for(
        let day=1;
        day<=daysInMonth;
        day++
    ){

        const date =
            new Date(
                year,
                month,
                day
            );


        const result =
            calculateDay(
                formatDate(
                    date
                )
            );


        completed +=
            result.completed;


        possible +=
            result.total;

    }


    if(
        possible
        ===
        0
    ){

        return 0;

    }


    return Math.round(

        completed

        /

        possible

        *

        100

    );

}


/* =====================================================
   STREAK
===================================================== */

function calculateStreak(){

    let streak =
        0;


    const base =
        parseDate(
            selectedDate
        );


    for(
        let i=0;
        i<365;
        i++
    ){

        const date =
            new Date(
                base
            );


        date.setDate(

            base.getDate()

            -

            i

        );


        const result =
            calculateDay(
                formatDate(
                    date
                )
            );


        if(

            result.total
            >
            0

            &&

            result.completed
            ===
            result.total

        ){

            streak++;

        }

        else{

            break;

        }

    }


    return streak;

}


/* =====================================================
   GOAL PROGRESS
===================================================== */

function renderGoalProgress(){

    const container =
        document.getElementById(
            "goalProgress"
        );


    container.innerHTML =
        "";


    const goals =
        appData[
            currentUser
        ]?.goals
        || [];


    if(
        goals.length
        ===
        0
    ){

        container.innerHTML =
            `
            <div class="empty">
                Add goals to view progress.
            </div>
            `;

        return;

    }


    goals.forEach(
        goal => {

            let completedDays =
                0;


            const days =
                7;


            const base =
                parseDate(
                    selectedDate
                );


            for(
                let i=0;
                i<days;
                i++
            ){

                const date =
                    new Date(
                        base
                    );


                date.setDate(

                    base.getDate()

                    -

                    i

                );


                const key =
                    formatDate(
                        date
                    );


                const day =
                    appData[
                        currentUser
                    ]
                    .days?.[
                        key
                    ]
                    || {};


                if(
                    day[
                        goal.id
                    ]
                    ===
                    true
                ){

                    completedDays++;

                }

            }


            const percentage =
                Math.round(

                    completedDays

                    /

                    days

                    *

                    100

                );


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "progress-row";


            row.innerHTML = `

                <div class="progress-header">

                    <span>

                        ${
                            escapeHtml(
                                goal.name
                            )
                        }

                    </span>


                    <span>

                        ${completedDays}/7

                    </span>

                </div>


                <div class="progress-track">

                    <div
                        class="progress-fill"

                        style="
                            width:${percentage}%;
                        "
                    ></div>

                </div>

            `;


            container.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   GRAPH
===================================================== */

function renderGraph(){

    const graph =
        document.getElementById(
            "graph"
        );


    graph.innerHTML =
        "";


    const base =
        parseDate(
            selectedDate
        );


    for(
        let i=13;
        i>=0;
        i--
    ){

        const date =
            new Date(
                base
            );


        date.setDate(

            base.getDate()

            -

            i

        );


        const key =
            formatDate(
                date
            );


        const result =
            calculateDay(
                key
            );


        const height =
            result.percentage
            *
            1.5;


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "graph-item";


        item.innerHTML = `

            <div class="graph-bar-area">

                <div
                    class="graph-bar"

                    style="
                        height:${height}px;
                    "
                >

                    <span class="graph-value">

                        ${result.completed}
                        /
                        ${result.total}

                    </span>

                </div>

            </div>


            <div class="graph-date">

                ${date.getDate()}
                /
                ${date.getMonth()+1}

            </div>

        `;


        graph.appendChild(
            item
        );

    }

}


/* =====================================================
   ADD GOAL
===================================================== */

window.openAddModal =
function(){

    editingGoalId =
        null;


    document
    .getElementById(
        "modalTitle"
    )
    .innerText =
        "Add New Goal";


    document
    .getElementById(
        "goalInput"
    )
    .value =
        "";


    document
    .getElementById(
        "goalModal"
    )
    .classList
    .add(
        "show"
    );

};


/* =====================================================
   EDIT GOAL
===================================================== */

window.editGoal =
function(
    id
){

    const goal =
        appData[
            currentUser
        ]
        .goals
        .find(

            goal =>
                String(
                    goal.id
                )
                ===
                String(
                    id
                )

        );


    if(
        !goal
    ){

        return;

    }


    editingGoalId =
        goal.id;


    document
    .getElementById(
        "modalTitle"
    )
    .innerText =
        "Edit Goal";


    document
    .getElementById(
        "goalInput"
    )
    .value =
        goal.name;


    document
    .getElementById(
        "goalModal"
    )
    .classList
    .add(
        "show"
    );

};


/* =====================================================
   SAVE GOAL
===================================================== */

window.saveGoal =
async function(){

    const input =
        document
        .getElementById(
            "goalInput"
        );


    const name =
        input.value.trim();


    if(
        !name
    ){

        alert(
            "Please enter a goal."
        );

        return;

    }


    if(
        editingGoalId
    ){

        const goal =
            appData[
                currentUser
            ]
            .goals
            .find(

                goal =>
                    String(
                        goal.id
                    )
                    ===
                    String(
                        editingGoalId
                    )

            );


        if(
            goal
        ){

            goal.name =
                name;

        }

    }

    else{

        appData[
            currentUser
        ]
        .goals
        .push({

            id:
                generateId(),

            name:
                name

        });

    }


    closeModal();


    renderEverything();


    await saveData();

};


/* =====================================================
   DELETE GOAL
===================================================== */

window.deleteGoal =
async function(
    id
){

    const confirmation =
        confirm(
            "Delete this goal?"
        );


    if(
        !confirmation
    ){

        return;

    }


    appData[
        currentUser
    ]
    .goals =

        appData[
            currentUser
        ]
        .goals
        .filter(

            goal =>
                String(
                    goal.id
                )
                !==
                String(
                    id
                )

        );


    renderEverything();


    await saveData();

};


/* =====================================================
   CLOSE MODAL
===================================================== */

window.closeModal =
function(){

    document
    .getElementById(
        "goalModal"
    )
    .classList
    .remove(
        "show"
    );

};


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    text
){

    const div =
        document.createElement(
            "div"
        );


    div.innerText =
        text;


    return div.innerHTML;

}


/* =====================================================
   RENDER EVERYTHING
===================================================== */

function renderEverything(){

    if(
        !appData[
            currentUser
        ]
    ){

        return;

    }


    document
    .getElementById(
        "selectedDate"
    )
    .value =
        selectedDate;


    document
    .getElementById(
        "userSelect"
    )
    .value =
        currentUser;


    const readable =
        parseDate(
            selectedDate
        )
        .toLocaleDateString(

            "en-IN",

            {

                weekday:
                    "long",

                day:
                    "numeric",

                month:
                    "long",

                year:
                    "numeric"

            }

        );


    document
    .getElementById(
        "dateDisplay"
    )
    .innerText =
        readable;


    const displayName =

        currentUser
        .charAt(0)
        .toUpperCase()

        +

        currentUser
        .slice(1);


    document
    .getElementById(
        "welcomeText"
    )
    .innerText =

        displayName

        +

        "'s Daily Tracker";


    renderHabits();

    renderDashboard();

    renderGoalProgress();

    renderGraph();

}

   START APP
===================================================== */

document
.getElementById(

)
.value =
    selectedDate;


document
.getElementById(
    "userSelect"
)
.value =
    currentUser;


loadInitialData();


</script>
